<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Guideflow · DLBCL 指南问答</title>
  <link rel="stylesheet" href="./styles.css?v=20260818-composer-ui" />
</head>
<body>
  <div class="app" id="appRoot">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-badge">G</div>
          <div class="brand-text">
            <div class="brand-title">Guideflow</div>
            <div class="muted small">DLBCL 指南问答</div>
          </div>
        </div>
        <button class="icon-btn" id="collapseSidebarBtn" title="收起侧栏" aria-label="收起侧栏">‹</button>
      </div>

      <button class="btn new-chat-btn" id="newChatBtn">＋ 开启新对话</button>

      <div class="history-wrap">
        <div class="history-label">历史记录</div>
        <div class="history-list" id="historyList"></div>
      </div>

      <div class="sidebar-footer" id="userArea">
        <button class="user-chip" id="loginOpenBtn">登录 / 注册</button>
      </div>
    </aside>

    <button class="sidebar-expand" id="expandSidebarBtn" title="展开侧栏" hidden>›</button>
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <main class="main">
      <div class="header">
        <h1 class="header-title" id="headerTitle"></h1>
        <div class="header-actions">
          <button type="button" class="header-action" id="shareChatBtn" title="分享聊天" aria-label="分享聊天" hidden></button>
          <button type="button" class="header-action" id="toolsBtn" title="设置与调试" aria-label="设置">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <section class="chat-panel">
        <div class="chat-log" id="chatLog"></div>
      </section>

      <div class="composer">
        <div class="composer-box" id="composerBox">
          <textarea id="followUpInput" placeholder="问一个临床问题……" rows="1"></textarea>
          <div class="composer-toolbar">
            <div class="composer-toolbar-left">
              <div class="chip-wrap" id="dataSourceWrap">
                <button type="button" class="composer-chip is-active" id="dataSourceChip"
                  aria-haspopup="listbox" aria-expanded="false" aria-controls="dataSourceMenu"
                  data-tip="选择指南数据源，单次检索不混用">
                  <span class="chip-icon chip-icon-guide" id="dataSourceChipIcon" aria-hidden="true"></span>
                  <span class="chip-label" id="dataSourceChipLabel">NCCN</span>
                </button>
                <div class="source-menu" id="dataSourceMenu" hidden role="listbox" aria-label="指南数据源">
                  <button type="button" class="source-menu-item" role="option" data-source="nccn">
                    <span class="source-menu-icon" data-guide-icon="nccn" aria-hidden="true"></span>
                    <span>NCCN</span>
                  </button>
                  <button type="button" class="source-menu-item" role="option" data-source="csco">
                    <span class="source-menu-icon" data-guide-icon="csco" aria-hidden="true"></span>
                    <span>CSCO</span>
                  </button>
                  <button type="button" class="source-menu-item" role="option" data-source="eha">
                    <span class="source-menu-icon" data-guide-icon="eha" aria-hidden="true"></span>
                    <span>EHA</span>
                  </button>
                </div>
              </div>
              <button type="button" class="composer-chip" id="enableLiteratureChip"
                aria-pressed="false"
                data-tip="联网检索 PubMed 摘要作为二级参考文献">
                <svg class="chip-icon chip-icon-globe" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="9"/>
                  <path d="M3 12h18"/>
                  <path d="M12 3a14 14 0 0 1 0 18"/>
                  <path d="M12 3a14 14 0 0 0 0 18"/>
                </svg>
                <span class="chip-label">联网文献</span>
              </button>
              <a class="composer-chip" id="molecularEvidenceBtn" href="./molecular-evidence.html"
                data-tip="打开分子证据模块（变异解释 / CIViC / ClinVar）"
                aria-label="分子证据">
                <svg class="chip-icon chip-icon-molecule" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 4c5 5 3 11 8 16"/>
                  <path d="M20 4c-5 5-3 11-8 16"/>
                  <path d="M8.2 8.2h7.6M7.2 12h9.6M8.2 15.8h7.6"/>
                </svg>
                <span class="chip-label">分子证据</span>
              </a>
            </div>
            <div class="composer-toolbar-right">
              <button type="button" class="toolbar-icon-btn" id="caseOpenBtn"
                data-tip="粘贴病历进行结构化分析" aria-label="病例分析">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                  <rect x="9" y="3" width="6" height="4" rx="1"/>
                  <path d="M9 12h6M9 16h4"/>
                </svg>
              </button>
              <button class="circle-btn" id="askBtn" aria-label="发送">➤</button>
            </div>
          </div>
        </div>
        <div class="composer-hint muted small">回车发送 · Shift+回车换行</div>
      </div>
    </main>

    <aside class="evidence-drawer" id="evidenceDrawer" aria-label="证据面板">
      <div class="evidence-drawer-head">
        <span class="refs-summary-left">
          <svg class="refs-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <text x="1" y="5" font-size="5" fill="currentColor" font-family="sans-serif">1</text>
            <line x1="7" y1="3.5" x2="15" y2="3.5" stroke="currentColor" stroke-width="1.2"/>
            <text x="1" y="10" font-size="5" fill="currentColor" font-family="sans-serif">2</text>
            <line x1="7" y1="8.5" x2="15" y2="8.5" stroke="currentColor" stroke-width="1.2"/>
            <text x="1" y="15" font-size="5" fill="currentColor" font-family="sans-serif">3</text>
            <line x1="7" y1="13.5" x2="15" y2="13.5" stroke="currentColor" stroke-width="1.2"/>
          </svg>
          <span id="evidenceDrawerTitle">证据</span>
        </span>
        <button class="icon-btn" id="evidenceDrawerCloseBtn" title="关闭证据" aria-label="关闭证据">✕</button>
      </div>
      <div class="evidence-drawer-body" id="evidenceDrawerBody"></div>
    </aside>
  </div>
  <button class="evidence-backdrop" id="evidenceBackdrop" hidden aria-label="关闭证据面板"></button>

  <div class="modal-overlay" id="authModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 id="authTitle">登录</h2>
        <button class="icon-btn" id="authCloseBtn" aria-label="关闭">✕</button>
      </div>
      <form id="authForm" class="auth-form">
        <label>邮箱<input type="email" id="authEmail" required autocomplete="username" /></label>
        <label id="authPasswordLabel">密码
          <div class="password-wrap">
            <input type="password" id="authPassword" required minlength="8" autocomplete="current-password" />
            <button type="button" class="pw-toggle" id="authPwToggle" aria-label="显示密码" title="显示密码" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>
        </label>
        <label id="authNewPasswordLabel" hidden>新密码
          <div class="password-wrap">
            <input type="password" id="authNewPassword" minlength="8" autocomplete="new-password" />
            <button type="button" class="pw-toggle" id="authNewPwToggle" aria-label="显示密码" title="显示密码" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>
        </label>
        <div class="auth-error" id="authError" hidden></div>
        <p class="auth-hint muted small" id="authHint" hidden></p>
        <div class="auth-actions">
          <button type="submit" class="btn primary" id="authSubmitBtn">登录</button>
          <button type="button" class="btn" id="authToggleModeBtn">没有账号？注册</button>
        </div>
        <button type="button" class="link-btn" id="authForgotBtn">忘记密码？</button>
      </form>
    </div>
  </div>

  <div class="cite-popover" id="citePopover" hidden></div>

  <div class="modal-overlay" id="feedbackModal" hidden>
    <div class="modal-card feedback-modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>医生反馈</h2>
        <button class="icon-btn" id="feedbackCloseBtn" aria-label="关闭">✕</button>
      </div>
      <form id="feedbackForm" class="auth-form feedback-form">
        <input type="hidden" id="feedbackMessageId" />
        <details class="feedback-context">
          <summary>查看关联问答</summary>
          <label>问题描述<textarea id="feedbackQuestion" rows="2" readonly></textarea></label>
          <label>回答摘要<textarea id="feedbackAnswer" rows="4" readonly></textarea></label>
        </details>
        <div class="feedback-field">
          <span class="feedback-field-label">总体评分</span>
          <select id="feedbackRating" class="sr-only" tabindex="-1" aria-hidden="true">
            <option value="5">5 - 很好</option>
            <option value="4">4 - 较好</option>
            <option value="3">3 - 一般</option>
            <option value="2">2 - 不太好</option>
            <option value="1">1 - 很差</option>
          </select>
          <div class="feedback-chip-row" id="feedbackRatingChips" role="radiogroup" aria-label="总体评分"></div>
        </div>
        <div class="feedback-field">
          <span class="feedback-field-label">反馈分类</span>
          <select id="feedbackCategory" class="sr-only" tabindex="-1" aria-hidden="true">
            <option>其他</option>
            <option>正确性问题</option>
            <option>证据不足 / 漏证据</option>
            <option>召回问题</option>
            <option>表达问题</option>
            <option>安全性 / 风险提示问题</option>
            <option>交互体验问题</option>
            <option>肯定反馈</option>
          </select>
          <div class="feedback-chip-row feedback-chip-row-wrap" id="feedbackCategoryChips" role="radiogroup" aria-label="反馈分类"></div>
        </div>
        <label class="feedback-comment-label">具体意见
          <textarea id="feedbackComment" rows="4" placeholder="指出不准确之处，或补充临床建议…"></textarea>
        </label>
        <div class="auth-error" id="feedbackError" hidden></div>
        <div class="auth-actions feedback-actions">
          <button type="submit" class="btn primary feedback-submit-btn">提交反馈</button>
          <button type="button" class="link-btn" id="feedbackCancelBtn">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="caseModal" hidden>
    <div class="modal-card case-modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>病例分析</h2>
        <button class="icon-btn" id="caseCloseBtn" aria-label="关闭">✕</button>
      </div>
      <form id="caseForm" class="auth-form case-form">
        <label>病例文本<textarea id="caseText" rows="10" placeholder="请粘贴入院记录、病理、免疫组化、治疗经过等文本。图片上传 OCR 将在下一阶段接入。"></textarea></label>
        <label>想问的问题<input id="caseQuestion" value="请结合指南分析该病例的诊疗路径和下一步建议。" /></label>
        <label>指南来源
          <select id="caseDataSource">
            <option value="csco">CSCO</option>
            <option value="nccn">NCCN</option>
          </select>
        </label>
        <div class="auth-error" id="caseError" hidden></div>
        <div class="auth-actions">
          <button type="submit" class="btn primary">开始分析</button>
          <button type="button" class="btn" id="caseCancelBtn">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div class="tools-menu" id="toolsMenu" hidden>
    <button type="button" data-tool="trace">Trace 调试</button>
    <button type="button" data-tool="sources">证据来源</button>
    <button type="button" data-tool="neo4j">Neo4j 图谱</button>
    <button type="button" data-tool="figures">流程图</button>
    <button type="button" data-tool="feedback-stats">反馈统计</button>
    <button type="button" data-tool="feedback-list">反馈列表</button>
  </div>

  <div class="modal-overlay" id="molecularEvidenceModal" hidden>
    <div class="modal-card molecular-modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>分子证据模块</h2>
        <button class="icon-btn" id="molecularEvidenceCloseBtn" aria-label="关闭">✕</button>
      </div>
      <form id="molecularEvidenceForm" class="auth-form molecular-form">
        <label>变异文本<textarea id="molecularVariantsText" rows="7" placeholder="例如：MYD88 p.L265P, CD79B p.Y196H\n支持多行、逗号、分号分隔。"></textarea></label>
        <div class="molecular-grid">
          <label>疾病<input id="molecularDisease" value="DLBCL" /></label>
          <label>样本类型<input id="molecularSampleType" value="tumor tissue" /></label>
          <label>GRCh 版本<input id="molecularGenomeBuild" placeholder="GRCh37 / GRCh38" /></label>
          <label>转录本<input id="molecularTranscript" placeholder="NM_..." /></label>
          <label>变异类型<input id="molecularVariantType" placeholder="SNV / fusion / amplification" /></label>
          <label>Provider<select id="molecularProviderMode"><option value="mock">mock</option><option value="live">live</option><option value="hybrid">hybrid</option></select></label>
        </div>
        <label>医生问题<textarea id="molecularQuestion" rows="3" placeholder="可选：例如，是否支持 DLBCL 分子分型解释？"></textarea></label>
        <div class="auth-error" id="molecularEvidenceError" hidden></div>
        <div class="auth-actions">
          <button type="submit" class="btn primary">查询</button>
          <button type="button" class="btn" id="molecularEvidenceCancelBtn">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="statsModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>反馈统计</h2>
        <button class="icon-btn" id="statsCloseBtn" aria-label="关闭">✕</button>
      </div>
      <div id="statsBody" class="stats-body muted">加载中…</div>
    </div>
  </div>

  <script>
    // /app/ (uvicorn 挂载或云上方案 A)：同源，勿写死 127.0.0.1（那是「本机」）。
    // 本地 5173 静态页：仍默认连本机 8001。
    function guideflowDefaultApiBase() {
      var path = location.pathname || '';
      if (path.indexOf('/app') === 0 || location.port === '8001') return '';
      return 'http://127.0.0.1:8001';
    }
    window.API_BASE = window.API_BASE ?? guideflowDefaultApiBase();
  </script>
  <script src="./vendor/marked.min.js?v=20260725"></script>
  <script src="./vendor/purify.min.js?v=20260725"></script>
  <script src="./app.js?v=20260818-composer-ui"></script>
</body>
</html>
