<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Guideflow · 分子证据内容</title>
  <link rel="stylesheet" href="./styles.css?v=20260831-me-rewrite" />
  <style>
    :root {
      --me-header-height: 64px;
      --me-sidebar-width: 224px;
      --me-composer-height: 96px;
      --me-divider: rgba(31, 59, 110, .12);
      --me-workspace: #f5f7fb;
      --me-blue: #1f3b6e;
      --me-blue-soft: rgba(31, 59, 110, .08);
      --me-orange: #e56d3d;
      --me-orange-soft: rgba(229, 111, 61, .12);
      --me-text: #2a2623;
      --me-muted: #6b7280;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--me-workspace);
      color: var(--me-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    a { color: var(--me-blue); text-decoration: none; }
    .me-shell {
      display: grid;
      grid-template-rows: var(--me-header-height) minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
      min-height: 0;
    }

    /* ============ 顶部栏 ============ */
    .me-hero {
      position: relative;
      z-index: 20;
      border-bottom: 1px solid var(--me-divider);
      background: #fff;
    }
    .me-hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      height: var(--me-header-height);
      box-sizing: border-box;
      padding: 0 24px;
    }
    .me-hero-copy { min-width: 0; display: flex; align-items: baseline; gap: 12px; }
    .me-kicker {
      color: var(--me-blue);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.01em;
      white-space: nowrap;
    }
    .me-title {
      margin: 0;
      color: var(--me-muted);
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .me-hero-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
    .me-hero-actions .btn { white-space: nowrap; padding: 8px 12px; font-size: 13px; box-shadow: none; }
    .hero-meta { color: var(--me-muted); font-size: 12px; white-space: nowrap; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--me-orange-soft);
      color: #8a4b2a;
      white-space: nowrap;
    }
    .status-badge.ok { background: rgba(46, 158, 91, .12); color: #1d6d43; }
    .status-badge.warn { background: rgba(245, 158, 11, .14); color: #9a6700; }
    .status-badge.bad { background: rgba(180, 40, 40, .10); color: #9b1c1c; }
    .status-badge.neutral { background: rgba(31, 59, 110, .08); color: var(--me-blue); }

    /* ============ 主体：左导航 + 右结果 ============ */
    .me-content {
      display: grid;
      grid-template-columns: var(--me-sidebar-width) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      min-height: 0;
      overflow: hidden;
    }
    .me-sidebar {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 20px 14px;
      border-right: 1px solid var(--me-divider);
      background: #fff;
      overflow-y: auto;
    }
    .me-sidebar-title {
      padding: 0 12px 10px;
      color: #7b879a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .section-sidebar { display: flex; flex-direction: column; gap: 4px; }
    .section-sidebar a {
      display: block;
      padding: 11px 13px;
      border-radius: 9px;
      color: #526075;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: background .12s ease, color .12s ease;
    }
    .section-sidebar a:hover { color: var(--me-blue); background: #eef4fc; }
    .section-sidebar a.active {
      color: var(--me-blue);
      background: #eef4fc;
      box-shadow: inset 3px 0 0 var(--me-orange);
    }
    .me-output {
      grid-column: 2;
      grid-row: 1;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 26px calc(var(--me-composer-height) + 30px);
    }

    /* ============ 指标卡 ============ */
    .me-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .summary-card {
      background: #fff;
      border: 1px solid rgba(0, 0, 0, .07);
      border-radius: 14px;
      padding: 12px 16px;
    }
    .summary-card .label { display: block; color: var(--me-muted); font-size: 12px; margin-bottom: 6px; }
    .summary-card strong { font-size: 22px; color: var(--me-blue); }
    .summary-card strong.warn { color: #9a6700; }
    .summary-card strong.bad { color: #9b1c1c; }
    .summary-card strong.ok { color: #1d6d43; }

    /* ============ 工具栏 ============ */
    .me-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .me-toolbar .left, .me-toolbar .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .me-toolbar .btn { padding: 8px 12px; font-size: 13px; box-shadow: none; }
    .history-count-badge {
      padding: 6px 12px;
      border-radius: 999px;
      background: #fdece3;
      color: #9b1c1c;
      font-size: 12px;
      font-weight: 800;
    }
    .history-panel {
      display: grid;
      gap: 8px;
      max-height: 340px;
      overflow: auto;
      margin-bottom: 12px;
    }
    .history-item {
      border: 1px solid rgba(0, 0, 0, .06);
      border-radius: 12px;
      padding: 10px 14px;
      background: #fff;
      cursor: pointer;
    }
    .history-item:hover { border-color: rgba(229, 111, 61, .28); }
    .history-item.active { border-color: rgba(229, 111, 61, .4); background: rgba(229, 111, 61, .05); }
    .history-item-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .history-item-title { font-weight: 700; font-size: 14px; }
    .history-item-meta { color: var(--me-muted); font-size: 12px; line-height: 1.6; margin-top: 4px; }

    /* ============ 章节卡片 ============ */
    .result-stack { display: grid; gap: 14px; min-width: 0; }
    .gene-section {
      border: 1px solid rgba(0, 0, 0, .07);
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
      scroll-margin-top: 16px;
    }
    .gene-section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: linear-gradient(180deg, #eef4fc, #f7faff);
      border-bottom: 1px solid rgba(0, 0, 0, .05);
    }
    .gene-section-title { font-size: 15px; font-weight: 800; color: var(--me-blue); }
    .gene-section-sub { font-size: 12px; color: var(--me-muted); margin-left: 8px; font-weight: 600; }
    .gene-section-count { font-size: 12px; color: var(--me-muted); font-weight: 700; white-space: nowrap; }
    .gene-section-body { padding: 16px 18px 18px; }

    /* ============ 医生摘要 / 概况 ============ */
    .doctor-summary { display: grid; gap: 12px; }
    .doctor-summary-conclusion {
      margin: 0;
      padding: 14px 16px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255, 248, 240, .9), rgba(255, 251, 243, .9));
      border: 1px solid rgba(229, 111, 61, .18);
      font-size: 15px;
      line-height: 1.8;
      color: #5c3a24;
    }
    .doctor-summary-conclusion.warn { background: linear-gradient(135deg, rgba(255, 251, 235, .9), rgba(255, 255, 255, .9)); border-color: rgba(245, 158, 11, .25); color: #7a5b10; }
    .doctor-summary-conclusion.alert { background: linear-gradient(135deg, rgba(254, 242, 242, .9), rgba(255, 255, 255, .9)); border-color: rgba(180, 40, 40, .2); color: #8a2b2b; }
    .doctor-summary-conclusion.ok { background: linear-gradient(135deg, rgba(240, 253, 244, .9), rgba(255, 255, 255, .9)); border-color: rgba(46, 158, 91, .2); color: #1d5b38; }
    .doctor-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .doctor-mini { border: 1px solid rgba(0, 0, 0, .06); border-radius: 12px; padding: 10px 12px; background: #fff; min-width: 0; }
    .doctor-mini .label { display: block; color: var(--me-muted); font-size: 12px; margin-bottom: 4px; }
    .doctor-mini .value { font-size: 14px; font-weight: 700; line-height: 1.5; color: var(--me-blue); overflow-wrap: anywhere; }
    .doctor-mini .value.warn { color: #9a6700; }
    .doctor-mini .value.alert { color: #9b1c1c; }
    .doctor-mini .value.ok { color: #1d6d43; }
    .summary-block { border: 1px solid rgba(0, 0, 0, .06); border-radius: 12px; padding: 12px 14px; }
    .summary-block h4 { margin: 0 0 8px; font-size: 13px; color: var(--me-blue); }
    .summary-block ul { margin: 0; padding-left: 18px; line-height: 1.75; }
    .summary-block li { margin: 2px 0; }
    .provider-chips { display: flex; flex-wrap: wrap; gap: 8px; }

    /* ============ 数据源状态 ============ */
    .provider-status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .provider-status-card {
      background: #fff;
      border: 1px solid rgba(0, 0, 0, .07);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .provider-status-card h4 { margin: 0 0 8px; font-size: 13px; color: var(--me-blue); display: flex; align-items: center; gap: 6px; }
    .provider-status-card .status-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .provider-status-card .status-label { font-size: 12px; color: var(--me-muted); }
    .provider-status-card .status-value { font-size: 13px; font-weight: 700; }
    .provider-status-card .status-value.success { color: #1d6d43; }
    .provider-status-card .status-value.no_evidence { color: #9a6700; }
    .provider-status-card .status-value.degraded { color: #9b1c1c; }
    .provider-status-card .status-value.incomplete { color: #9a6700; }
    .provider-status-card .status-value.pending { color: var(--me-muted); }

    /* ============ 变异分析 ============ */
    .variant-card { border: 1px solid rgba(0, 0, 0, .07); border-radius: 14px; padding: 14px 16px; background: #fff; }
    .variant-card + .variant-card { margin-top: 12px; }
    .variant-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .variant-name { font-size: 16px; font-weight: 800; color: var(--me-blue); }
    .variant-raw { margin-top: 6px; color: var(--me-muted); font-size: 12px; line-height: 1.6; }
    .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 12px; }
    .kv-item { border: 1px solid rgba(0, 0, 0, .06); border-radius: 10px; padding: 8px 10px; background: #fafbfd; min-width: 0; }
    .kv-item.wide { grid-column: span 2; }
    .kv-item .k { font-size: 11px; color: var(--me-muted); margin-bottom: 3px; font-weight: 600; }
    .kv-item .v { font-size: 13px; font-weight: 700; line-height: 1.45; overflow-wrap: anywhere; }
    .variant-footer { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
    .resolver-badge {
      display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 700; border: 1px solid rgba(0, 126, 167, .22);
      background: rgba(0, 126, 167, .08); color: #0c6a88; white-space: nowrap;
    }
    .resolver-badge.blue { border-color: rgba(31, 59, 110, .22); background: rgba(31, 59, 110, .08); color: var(--me-blue); }
    .warning-block {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(245, 158, 11, .08);
      border: 1px solid rgba(245, 158, 11, .18);
      color: #7a5b10;
      font-size: 12px;
      line-height: 1.7;
    }
    .warning-block.bad { background: rgba(180, 40, 40, .07); border-color: rgba(180, 40, 40, .18); color: #8a2b2b; }

    /* ============ 临床解释 ============ */
    .answer-md { line-height: 1.75; font-size: 14px; }
    .answer-md h2 { font-size: 17px; margin: 16px 0 8px; color: var(--me-blue); }
    .answer-md h3 { font-size: 15px; margin: 14px 0 6px; color: var(--me-blue); }
    .answer-md p { margin: 0 0 10px; }
    .answer-md ul { margin: 6px 0 10px; padding-left: 20px; }
    .answer-md li { margin: 3px 0; }
    .answer-md code { background: rgba(0, 0, 0, .05); padding: 1px 5px; border-radius: 6px; font-size: 12px; }
    .answer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(0, 0, 0, .06);
    }
    .answer-actions .btn {
      padding: 7px 12px;
      font-size: 12px;
      box-shadow: none;
    }
    .sub-box { margin-top: 14px; border: 1px solid rgba(229, 111, 61, .16); border-radius: 12px; padding: 12px 14px; background: rgba(255, 251, 247, .8); }
    .sub-box h4 { margin: 0 0 8px; font-size: 13px; color: #8a4b2a; }
    .sub-box ol, .sub-box ul { margin: 0; padding-left: 20px; line-height: 1.7; }
    .sub-box li { margin: 3px 0; font-size: 13px; }

    /* ============ 证据来源 ============ */
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .filter-chip {
      border: 1px solid rgba(31, 59, 110, .14);
      background: #fff;
      color: var(--me-text);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all .12s ease;
    }
    .filter-chip:hover { border-color: rgba(229, 111, 61, .3); }
    .filter-chip.active {
      background: rgba(229, 111, 61, .1);
      border-color: rgba(229, 111, 61, .34);
      color: #8a4b2a;
    }
    .evidence-card { border: 1px solid rgba(0, 0, 0, .07); border-radius: 14px; padding: 14px 16px; background: #fff; }
    .evidence-card + .evidence-card { margin-top: 10px; }
    .evidence-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .evidence-title { font-size: 14px; font-weight: 800; color: var(--me-blue); line-height: 1.5; overflow-wrap: anywhere; }
    .evidence-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--me-muted); font-size: 12px; margin-top: 8px; line-height: 1.6; }
    .evidence-meta span { overflow-wrap: anywhere; }
    .provider-badge {
      display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 800; border: 1px solid transparent; white-space: nowrap;
    }
    .provider-badge.civic { background: rgba(111, 76, 255, .1); color: #5840b3; border-color: rgba(111, 76, 255, .18); }
    .provider-badge.clinvar { background: rgba(0, 126, 167, .1); color: #0c6a88; border-color: rgba(0, 126, 167, .18); }
    .provider-badge.myvariant { background: rgba(120, 120, 120, .1); color: #666; border-color: rgba(120, 120, 120, .18); }
    .provider-badge.mock { background: rgba(120, 120, 120, .1); color: #666; border-color: rgba(120, 120, 120, .18); }
    .evidence-claim { margin-top: 10px; line-height: 1.8; font-size: 13px; }
    .reading-hint {
      margin-top: 10px; padding: 9px 12px; border-radius: 10px;
      background: rgba(245, 158, 11, .09); border: 1px solid rgba(245, 158, 11, .2);
      color: #7a5b10; font-size: 12px; line-height: 1.7;
    }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin-top: 12px; }
    .detail-item { border: 1px solid rgba(0, 0, 0, .05); border-radius: 10px; padding: 9px 11px; background: #fafbfd; }
    .detail-item .k { font-size: 11px; color: var(--me-muted); margin-bottom: 3px; font-weight: 600; }
    .detail-item .v { font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
    .detail-item.wide { grid-column: span 2; }

    /* ============ 安全门控 ============ */
    .gate-card { border: 1px solid rgba(0, 0, 0, .07); border-radius: 14px; padding: 13px 15px; background: #fff; }
    .gate-card + .gate-card { margin-top: 10px; }
    .gate-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
    .gate-target { font-weight: 800; font-size: 14px; }
    .gate-strength { color: var(--me-muted); font-size: 12px; margin-top: 4px; }
    .gate-note {
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(245, 158, 11, .08);
      border: 1px solid rgba(245, 158, 11, .18);
      color: #7a5b10;
      font-size: 12px;
      line-height: 1.7;
    }
    .gate-note span { display: block; }
    .gate-note span + span { margin-top: 4px; }
    .gate-blocks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
    .gate-blocks-label { color: var(--me-muted); font-size: 12px; font-weight: 700; margin-right: 2px; }
    .gate-block-tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(180, 40, 40, .08);
      color: #9b1c1c;
      border: 1px solid rgba(180, 40, 40, .16);
      white-space: nowrap;
    }

    /* ============ 补充信息 ============ */
    .missing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
    .missing-card { border: 1px solid rgba(0, 0, 0, .07); border-radius: 12px; padding: 12px 14px; background: #fff; }
    .missing-card h4 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .missing-card ul { margin: 0; padding-left: 18px; line-height: 1.8; font-size: 13px; }
    .missing-card li { margin: 3px 0; }

    /* ============ Agent Trace ============ */
    .trace-section { display: grid; gap: 8px; }
    .trace-card { border: 1px solid rgba(0, 0, 0, .06); border-radius: 10px; padding: 10px 12px; background: #fafbfd; font-size: 12px; }
    .trace-card .trace-step { font-weight: 700; color: var(--me-blue); margin-bottom: 4px; }
    .trace-card .trace-detail { color: var(--me-muted); line-height: 1.6; }

    /* ============ 底部浮动输入 ============ */
    .floating-composer {
      position: fixed;
      left: var(--me-sidebar-width);
      right: 0;
      bottom: 0;
      z-index: 30;
      min-height: var(--me-composer-height);
      box-sizing: border-box;
      padding: 14px max(26px, calc((100vw - var(--me-sidebar-width) - 860px) / 2)) 12px;
      border-top: 1px solid var(--me-divider);
      background: #fff;
      box-shadow: 0 -8px 24px rgba(31, 59, 110, .06);
    }
    .floating-composer-box {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 12px 14px 10px;
      border: 1px solid rgba(31, 59, 110, .16);
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 4px 16px rgba(31, 59, 110, .08);
    }
    .floating-composer textarea {
      width: 100%;
      min-height: 48px;
      height: 48px;
      max-height: 320px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 4px;
      font: inherit;
      line-height: 1.55;
      background: transparent;
      overflow-y: auto;
    }
    .floating-composer textarea::placeholder { color: #8c96a6; }
    .composer-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
    .composer-toolbar-left,
    .composer-toolbar-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .composer-toolbar-right { flex-shrink: 0; margin-left: auto; }
    .param-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid rgba(98, 76, 60, .14);
      background: rgba(246, 242, 238, .9);
      color: #5c534c;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }
    .param-chip:hover { background: #f0ebe6; border-color: rgba(98, 76, 60, .22); }
    .param-chip.has-popover { background: rgba(229, 111, 61, .10); border-color: rgba(229, 111, 61, .3); color: #8a4b2a; }
    .param-chip.has-popover:hover { background: rgba(229, 111, 61, .18); }
    .param-chip.has-popover.is-open { background: rgba(229, 111, 61, .16); border-color: rgba(229, 111, 61, .42); }
    .param-chip-icon { flex-shrink: 0; display: block; }
    .param-chip-label { line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56vw; }

    /* ============ 加载 / 空态 ============ */
    .loading-row {

    }
    @keyframes me-spin { to { transform: rotate(360deg); } }
    .error-box { border-radius: 12px; background: #fef2f2; color: #991b1b; padding: 10px 12px; border: 1px solid rgba(180, 40, 40, .12); line-height: 1.6; margin-top: 10px; }
    .empty-result {
      display: grid;
      gap: 8px;

    @media (max-width: 980px) {

  <script>
    (function () {
      'use strict';

      function guideflowDefaultApiBase() {
        var path = location.pathname || '';
        if (path.indexOf('/app') === 0 || location.port === '8001') return '';
        return 'http://127.0.0.1:8001';
      }
      const API_BASE = window.API_BASE ?? guideflowDefaultApiBase();
      const $ = (id) => document.getElementById(id);
      const els = {
        providerStatusGrid: $('providerStatusGrid'),
        clinvarStatus: $('clinvarStatus'),
        clinvarQueryCount: $('clinvarQueryCount'),
        clinvarRecordCount: $('clinvarRecordCount'),
        civicStatus: $('civicStatus'),
        civicQueryCount: $('civicQueryCount'),
        civicRecordCount: $('civicRecordCount'),
        myvariantStatus: $('myvariantStatus'),
        myvariantQueryCount: $('myvariantQueryCount'),
        myvariantRecordCount: $('myvariantRecordCount'),
        summaryGrid: $('summaryGrid'),
        variantCount: $('variantCount'),
        evidenceCount: $('evidenceCount'),
        gateState: $('gateState'),
        heroStateBadge: $('heroStateBadge'),
        heroTime: $('heroTime'),
        heroMode: $('heroMode'),
        copySummaryBtn: null,
        copyAnswerBtn: null,
        summaryEvidenceBadge: $('summaryEvidenceBadge'),
        historyToggleBtn: $('historyToggleBtn'),
        clearHistoryBtn: $('clearHistoryBtn'),
        historyCountBadge: $('historyCountBadge'),
        historyPanel: $('historyPanel'),
        resultStack: $('resultStack'),
        resultSidebar: $('resultSidebar'),
        composerText: $('composerText'),
        composerSendBtn: $('composerSendBtn'),
        composerAddBtn: $('composerAddBtn'),
        composerStatus: $('composerStatus'),
        settingsPanel: $('settingsPanel'),
        reportImageInput: $('reportImageInput'),
        paramChip: $('paramChip'),
        paramChipLabel: $('paramChipLabel'),
        disease: $('disease'),
        sampleType: $('sampleType'),
        genomeBuild: $('genomeBuild'),
        transcript: $('transcript'),
        variantType: $('variantType'),
        providerMode: $('providerMode'),
      };

      const HISTORY_KEY = 'gf_molecular_evidence_history_v3';
      const HISTORY_LIMIT = 30;
      const state = {
        lastPayload: null,
        history: [],
        historyVisible: false,
        summaryVisible: true,
        cardFilter: 'all',
      };

      /* ---------------- 工具函数 ---------------- */
      function escapeHtml(text) {
        return String(text ?? '').replace(/[&<>"']/g, (s) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        }[s]));
      }
      function normalizeWarnings(list) {
        return Array.isArray(list) ? list.filter(Boolean) : [];
      }
      function api(path, options = {}) {
        return fetch(`${API_BASE}${path}`, {
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
          ...options,
        });
      }
      function setError(msg) {
        els.composerStatus.textContent = msg || '输入分子信息（如 MYD88 p.L265P, CD79B p.Y196H），或通过“+”上传报告图片';
        els.composerStatus.classList.toggle('composer-error', Boolean(msg));
      }
      function md(raw) {
        const value = String(raw || '');
        let html;
        try {
          html = window.marked?.parse ? window.marked.parse(value, { breaks: true }) : escapeHtml(value).replace(/\n/g, '<br>');
        } catch {
          html = escapeHtml(value).replace(/\n/g, '<br>');
        }
        return window.DOMPurify ? window.DOMPurify.sanitize(html) : html;
      }

      const UI_TRANSLATIONS = {
        unique: '唯一匹配', protein_level_only: '仅蛋白层匹配', ambiguous: '存在歧义', insufficient: '信息不足', conflicting: '存在冲突',
        allow: '允许', downgrade: '保守使用', ask_for_confirmation: '需要确认', refuse: '拒绝输出',
        metadata_only: '仅元数据', live_metadata: '在线元数据', abstract_only: '仅摘要', not_accessible: '无法访问',
        accepted: '已接受', submitted: '已提交，尚待审核', supported: '有证据支持', verified: '已核验', curated: '已人工整理', mock_accepted: '本地示例', mock: '本地示例',
        supports: '支持', does_not_support: '不支持', database_record: '数据库记录',
        predictive: '预测性', diagnostic: '诊断性', prognostic: '预后性', oncogenic: '致癌性', functional: '功能性', biological: '生物学',
        'germline pathogenicity': '胚系致病性', 'somatic oncogenicity': '体细胞致癌性', 'somatic clinical impact': '体细胞临床影响',
        live: '多库在线检索', hybrid: '在线与本地混合检索', mock: '本地测试',
        civic: 'CIViC在线检索', clinvar: 'ClinVar在线检索', myvariant: 'MyVariant注释',
        'tumor tissue': '肿瘤组织', 'bone marrow': '骨髓', 'peripheral blood': '外周血',
        success: '成功', no_evidence: '无证据', degraded: '受限', incomplete: '不完整', pending: '待执行',
        // allowed_claim_strength
        variant_level_evidence_lookup: '变异级证据查询',
        no_definitive_variant_claim: '暂不给出确定性结论',
        evidence_supported_contextual_claim: '有证据支持的语境化结论',
        literature_lead_or_database_signal_only: '仅线索参考（摘要/数据库信号）',
        extrapolation_only: '仅外推参考',
        conflicted_evidence: '存在冲突，结论保守',
        unaccepted_or_uncertain_record: '记录未确认，仅作线索',
        low_level_evidence: '低等级证据，仅作线索',
        // blocked_outputs
        patient_level_treatment_plan: '患者级治疗方案',
        individual_prognosis_prediction: '个体预后预测',
        drug_dose: '药物剂量',
        definitive_diagnosis: '明确诊断',
        patient_level_prognosis: '患者级预后',
        infer_targetability_from_oncogenicity: '由致癌性推断靶向药',
        treatment_recommendation: '治疗推荐',
        diagnosis: '诊断',
      };
      function zh(value) {
        if (value === null || value === undefined || value === '') return '-';
        const text = String(value);
        const direct = UI_TRANSLATIONS[text.toLowerCase()];
        if (direct) return direct;
        return text.split(/(\s*\/\s*|\s*;\s*)/).map((part) => UI_TRANSLATIONS[part.trim().toLowerCase()] || part).join('');
      }
      function providerLabel(value) {
        const key = String(value || '').toLowerCase();
        if (key === 'clinvar') return 'ClinVar临床变异数据库';
        if (key === 'civic') return 'CIViC肿瘤临床证据库';
        if (key === 'myvariant') return 'MyVariant变异注释';
        if (key === 'mock') return '本地示例库';
        return zh(value);
      }
      function toneOf(value) {
        const lower = String(value || '').toLowerCase();
        if (lower.includes('refuse')) return 'bad';
        if (lower.includes('ask') || lower.includes('confirm') || lower.includes('downgrade') || lower.includes('ambiguous') || lower.includes('insufficient')) return 'warn';
        return 'ok';
      }
      function variantLabel(v) {
        return [v.gene, v.protein_hgvs || v.cdna_hgvs || v.genomic_hgvs || '未明确位点'].filter(Boolean).join(' ');
      }

function formatRetrievedAt(value) {
        if (!value) return '-';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return String(value);
        const p = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      }

      /* ---------------- 渲染：数据源状态 ---------------- */
      function renderProviderStatus(payload) {
        const audit = payload.audit || {};
        const providerStatus = audit.provider_status || {};
        
        // ClinVar
        const clinvar = providerStatus.ClinVar || {};
        els.clinvarStatus.textContent = zh(clinvar.state || '-');
        els.clinvarStatus.className = 'status-value ' + (clinvar.state || '');
        els.clinvarQueryCount.textContent = String(clinvar.query_count || 0);
        els.clinvarRecordCount.textContent = String(clinvar.record_count || 0);
        
        // CIViC
        const civic = providerStatus.CIViC || {};
        els.civicStatus.textContent = zh(civic.state || '-');
        els.civicStatus.className = 'status-value ' + (civic.state || '');
        els.civicQueryCount.textContent = String(civic.query_count || 0);
        els.civicRecordCount.textContent = String(civic.record_count || 0);
        
        // MyVariant
        const myvariant = providerStatus.MyVariant || {};
        els.myvariantStatus.textContent = zh(myvariant.state || '-');
        els.myvariantStatus.className = 'status-value ' + (myvariant.state || '');
        els.myvariantQueryCount.textContent = String(myvariant.query_count || 0);
        els.myvariantRecordCount.textContent = String(myvariant.record_count || 0);
        
        els.providerStatusGrid.hidden = false;
      }

      /* ---------------- 渲染：医生摘要 / 概况 ---------------- */
      function renderSummarySection(payload) {
        const summary = payload.summary || {};
        const variants = payload.variants || [];
        const cards = payload.evidence || [];
        const gates = [...(payload.safety?.variant_gates || []), ...(payload.safety?.card_gates || [])];
        const warnCount = gates.filter((g) => g.decision === 'downgrade' || g.decision === 'ask_for_confirmation' || g.decision === 'refuse').length;
        const gateState = warnCount ? '保守 / 需注意' : (gates.some((g) => g.decision === 'allow') ? '允许' : '未知');
        els.variantCount.textContent = String(variants.length || 0);
        els.evidenceCount.textContent = String(cards.length || 0);
        els.gateState.textContent = gateState;
        els.gateState.className = warnCount ? 'warn' : 'ok';
        els.heroStateBadge.textContent = gateState;
        els.heroStateBadge.className = `status-badge ${warnCount ? 'warn' : 'ok'}`;
        els.heroTime.textContent = `检索时间 ${formatRetrievedAt(payload.meta?.retrieved_at)}`;
        els.heroMode.textContent = `模式 ${zh(payload.meta?.provider_mode || '-')}`;

        if (!summary || !summary.conclusion) {
          return `<div class="result-muted">当前输入未生成医生摘要。请检查下方变异与证据分区。</div>`;
        }
        const evidenceStrength = String(summary.evidence_strength || gateState || '');
        const conclusionTone = evidenceStrength === 'confirm' ? 'alert' : (evidenceStrength === 'downgrade' ? 'warn' : (evidenceStrength === 'allow' ? 'ok' : ''));
        const highlights = Array.isArray(summary.highlights) ? summary.highlights : [];
        const providerCounts = summary.provider_counts || {};
        const topEvidence = dedupeCards((Array.isArray(summary.top_evidence) ? summary.top_evidence : []).filter(isDisplayableCard));

        const stats = [
          { label: '优先动作', value: summary.priority_action || '—', tone: conclusionTone || 'warn' },
          { label: '下一步建议', value: summary.recommended_next_step || summary.next_step || '—', tone: '' },
          { label: '变异数 / 证据卡', value: `${summary.variant_count ?? variants.length ?? 0} / ${summary.card_count ?? cards.length ?? 0}`, tone: '' },
          { label: '直接 / 近似 / 外推', value: `${summary.direct_evidence_count ?? 0} / ${summary.near_evidence_count ?? 0} / ${summary.proxy_evidence_count ?? 0}`, tone: '' },
        ];
        const providerChips = Object.entries(providerCounts).map(([k, v]) => {
          const cls = String(k).toLowerCase();
          return `<span class="provider-badge ${escapeHtml(cls)}">${escapeHtml(providerLabel(k))} ${escapeHtml(String(v))} 条</span>`;
        }).join('');

        let topEvidenceHtml = '';
        if (topEvidence.length && state.summaryVisible) {
          topEvidenceHtml = `
            <div class="summary-block" id="summaryEvidenceBlock">
              <h4>优先阅读的证据</h4>
              <div style="display:grid;gap:8px;margin-top:8px;">
                ${topEvidence.map((e) => `
                  <div style="border:1px solid rgba(0,0,0,.06);border-radius:10px;padding:9px 12px;background:#fafbfd;">
                    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;">
                      <strong style="font-size:13px;">${escapeHtml(e.source_title || e.source_id || 'Evidence')}</strong>
                      <span class="provider-badge ${escapeHtml(String(e.provider || 'mock').toLowerCase())}">${escapeHtml(providerLabel(e.provider))}</span>
                    </div>
                    <div style="margin-top:6px;font-size:12px;color:var(--me-muted);line-height:1.7;">${escapeHtml(e.claim || '')}</div>
                    <div style="margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--me-muted);">
                      <span>内部等级：${escapeHtml(e.evidence_level || '-')}</span>
                      <span>疾病匹配：${escapeHtml(e.disease_match || '-')}</span>
                      ${e.source_url ? `<a href="${escapeHtml(e.source_url)}" target="_blank" rel="noopener noreferrer">打开来源 →</a>` : ''}
                    </div>
                  </div>`).join('')}
              </div>
            </div>`;
        }

        return `
          <div class="doctor-summary">
            <p class="doctor-summary-conclusion ${escapeHtml(conclusionTone)}">${escapeHtml(summary.conclusion || '—')}</p>
            <div class="doctor-grid">
              ${stats.map((s) => `<div class="doctor-mini"><span class="label">${escapeHtml(s.label)}</span><span class="value ${escapeHtml(s.tone)}">${escapeHtml(s.value)}</span></div>`).join('')}
            </div>
            ${highlights.length ? `<div class="summary-block"><h4>摘要要点</h4><ul>${highlights.map((x) => `<li>${escapeHtml(x)}</li>`).join('')}</ul></div>` : ''}
            ${providerChips ? `<div class="summary-block"><h4>来源分布</h4><div class="provider-chips">${providerChips}</div></div>` : ''}
            ${topEvidenceHtml}
          </div>`;
      }

      /* ---------------- 渲染：变异分析 ---------------- */
      function renderVariantsSection(payload) {
        const variants = payload.variants || [];
        if (!variants.length) return `<div class="result-muted">未从输入中识别到标准变异，请检查下方补充信息。</div>`;
        return variants.map((v) => {
          const summary = v.evidence_summary || {};
          const gate = v.gate || {};
          const missing = v.missing || {};
          const ann = v.molecular_annotation || {};
          const proteinEffect = ann.protein_effect === 'loss_of_function' ? '功能缺失（LOF）' : ann.protein_effect === 'gain_of_function' ? '功能获得（GOF）' : ann.protein_effect === 'possible_missense_effect' ? '可能错义效应' : '未知';
          const mappingStatusZh = {
            'unique': '唯一匹配',
            'protein_level_only': '仅蛋白层匹配',
            'ambiguous': '存在歧义',
            'insufficient': '信息不足',
            'conflicting': '存在冲突'
          };
          const kv = [
            { k: '官方符号', v: v.gene || '—' },
            { k: '变异位点', v: v.protein_hgvs || v.cdna_hgvs || v.genomic_hgvs || '未明确位点' },
            { k: '变异类型', v: ann.variant_type || v.variant_type || 'unknown' },
            { k: '位点性质', v: ann.exon_relevance || 'unknown' },
            { k: '转录本', v: v.transcript || '未提供' },
            { k: 'GRCh 版本', v: v.genome_build || '未提供' },
            { k: '基因组坐标', v: v.genomic_hgvs || '未提供', wide: true },
            { k: '蛋白质效应', v: proteinEffect },
            { k: '蛋白影响说明', v: ann.protein_impact_note || '当前证据不足', wide: true },
            { k: '基因属性', v: ann.gene_role || '未知' },
            { k: '肿瘤作用', v: ann.oncology_effect || '未知' },
            { k: '数据库分型提示', v: ann.database_class_hint || 'context_dependent' },
            { k: '靶向线索', v: (ann.targetability || []).length ? ann.targetability.join('、') : '暂无', wide: true },
          ];
          const pathwayItems = [];
          if ((ann.upstream_pathways || []).length) pathwayItems.push(`上游：${ann.upstream_pathways.join('、')}`);
          if ((ann.downstream_pathways || []).length) pathwayItems.push(`下游：${ann.downstream_pathways.join('、')}`);
          if ((ann.go_terms || []).length) pathwayItems.push(`功能归类：${ann.go_terms.join('、')}`);
          const providerParts = Object.entries(summary.providers || {}).map(([k, n]) => `${providerLabel(k)} ${n}`);
          const warnings = normalizeWarnings(v.warnings);
          const blockingMissing = normalizeWarnings(missing.blocking);
          const advisoryMissing = normalizeWarnings(missing.advisory);

          return `
            <article class="variant-card">
              <div class="variant-head">
                <div style="min-width:0;">
                  <div class="variant-name">${escapeHtml(variantLabel(v))}</div>
                  <div class="variant-raw">原始输入：${escapeHtml(v.raw_input || '—')}</div>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                  <span class="status-badge ${toneOf(v.mapping_status)}">映射：${escapeHtml(mappingStatusZh[v.mapping_status] || zh(v.mapping_status))}</span>
                  ${gate.decision ? `<span class="status-badge ${toneOf(gate.decision)}">门控：${escapeHtml(zh(gate.decision))}</span>` : ''}
                </div>
              </div>
              <div class="kv-grid">
                ${kv.map((item) => `<div class="kv-item ${item.wide ? 'wide' : ''}"><div class="k">${escapeHtml(item.k)}</div><div class="v">${escapeHtml(item.v || '—')}</div></div>`).join('')}
              </div>
              ${pathwayItems.length ? `
                <div class="variant-footer">
                  ${pathwayItems.map((x) => `<span class="resolver-badge blue">${escapeHtml(x)}</span>`).join('')}
                </div>` : ''}
              ${v.enrichment && Object.keys((v.enrichment.resolved_fields || {})).length ? `
                <div class="variant-footer">
                  <span class="resolver-badge">坐标补充</span>
                  <span style="font-size:12px;color:var(--me-muted);">${escapeHtml(v.genomic_hgvs || '')} · 来源：${escapeHtml(v.enrichment.source || '解析器')}</span>
                </div>` : ''}
              <div class="variant-footer">
                <span class="status-badge ok">证据 ${escapeHtml(String(summary.total ?? 0))} 条</span>
                <span class="status-badge ok">直接 ${escapeHtml(String(summary.direct ?? 0))}</span>
                <span class="status-badge warn">近似 ${escapeHtml(String(summary.near ?? 0))}</span>
                <span class="status-badge warn">外推 ${escapeHtml(String(summary.proxy ?? 0))}</span>
                <span class="status-badge neutral">其他 ${escapeHtml(String(summary.unknown ?? 0))}</span>
                ${providerParts.length ? `<span class="resolver-badge blue">${escapeHtml(providerParts.join('、'))}</span>` : ''}
              </div>
              ${warnings.length ? `<div class="warning-block">解析警告：${escapeHtml(warnings.join('；'))}</div>` : ''}
              ${blockingMissing.length ? `<div class="warning-block bad"><strong>待补充：</strong>${escapeHtml(blockingMissing.join('；'))}</div>` : ''}
              ${advisoryMissing.length ? `<div class="warning-block"><strong>建议补充：</strong>${escapeHtml(advisoryMissing.join('；'))}</div>` : ''}
            </article>`;
        }).join('');
      }

      /* ---------------- 渲染：临床判断与建议 ---------------- */
      function renderAnswerSection(payload) {
        const summary = payload.summary || {};
        const pathwayNotes = Array.isArray(summary.pathway_notes) ? summary.pathway_notes : [];
        const reportItems = Array.isArray(summary.report_template) ? summary.report_template : [];
        const rawAnswer = String(payload.answer?.markdown || '暂无完整回答。');
        const answerText = rawAnswer
          .replace(/^\s*#{1,6}\s*(直接回答|针对临床问题的判断)\s*$/gim, '')
          .replace(/^\s*#{1,6}\s*/gim, '')
          .replace(/\*\*/g, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
        const hasAnswer = Boolean(payload.answer?.markdown);
        const hasSummary = Boolean(payload.summary);
        const adviceItems = [
          summary.recommended_next_step || summary.next_step ? `下一步建议：${summary.recommended_next_step || summary.next_step}` : '',
          summary.priority_action ? `优先动作：${summary.priority_action}` : '',
          ...pathwayNotes.map((x) => `通路提示：${x}`),
          ...reportItems.map((x) => `报告建议：${x}`),
        ].filter(Boolean);
        return `
          <div class="summary-block" style="margin-bottom:12px;">
            <h4>临床判断</h4>
            <p style="margin:0;line-height:1.8;">${escapeHtml(summary.conclusion || '当前结果仅支持线索性解释，需结合病理、分型和完整临床资料综合判断。')}</p>
          </div>
          ${adviceItems.length ? `<div class="sub-box"><h4>临床建议</h4><ul>${adviceItems.map((x) => `<li>${escapeHtml(x)}</li>`).join('')}</ul></div>` : ''}
          <div class="answer-md">${md(answerText)}</div>
          <div class="answer-actions" role="toolbar" aria-label="复制操作">
            <button type="button" class="btn ghost" data-copy-action="summary" ${hasSummary ? '' : 'disabled'}>复制摘要</button>
            <button type="button" class="btn ghost" data-copy-action="answer" ${hasAnswer ? '' : 'disabled'}>复制结果</button>
          </div>`;
      }

      /* ---------------- 渲染：证据来源 ---------------- */
      function isDisplayableCard(card) {
        const status = String(card?.access_status || '').toLowerCase();
        const title = `${card?.source_title || ''} ${card?.source_id || ''}`.toLowerCase();
        if (status === 'not_accessible' || status === 'query_error') return false;
        if (title.includes('query error') || title.includes('query_error')) return false;
        return true;
      }
      function dedupeCards(cards) {
        const seen = new Set();
        const out = [];
        (cards || []).forEach((card) => {
          const key = [
            card?.variant_id || '',
            String(card?.provider || '').toLowerCase(),
            String(card?.source_title || '').trim(),
            String(card?.claim || '').trim(),
            String(card?.evidence_level || '').toUpperCase(),
            String(card?.disease_match || '').trim(),
          ].join('|');
          if (seen.has(key)) return;
          seen.add(key);
          out.push(card);
        });
        return out;
      }
      function cardMatchesFilter(card) {
        const f = state.cardFilter;
        if (f === 'all') return true;
        const disease = String(card?.disease_match || '').toLowerCase();
        const level = String(card?.evidence_level || '').toUpperCase();
        const provider = String(card?.provider || '').toLowerCase();
        if (f === 'direct') return disease.includes('直接');
        if (f === 'near') return disease.includes('近似');
        if (f === 'proxy') return disease.includes('外推');
        if (f === 'low') return level === 'L4' || level === 'L5';
        if (f === 'clinvar') return provider === 'clinvar';
        if (f === 'civic') return provider === 'civic';
        if (f === 'myvariant') return provider === 'myvariant';
        return true;
      }
      function renderEvidenceSection(payload) {
        const allCards = dedupeCards((payload.evidence || []).filter(isDisplayableCard));
        const cards = allCards.filter(cardMatchesFilter);
        if (!allCards.length) {
          return `<div class="result-muted">暂无可展示证据卡。注意：未检索到记录≠该变异无证据，请结合数据源状态判断。</div>`;
        }
        return `
          <div class="filter-row">
            ${[['all', '全部'], ['direct', 'DLBCL 直接'], ['near', 'LBCL 近似'], ['proxy', '外推'], ['low', '低等级'], ['clinvar', 'ClinVar'], ['civic', 'CIViC'], ['myvariant', 'MyVariant']].map(([key, label]) =>
              `<button type="button" class="filter-chip ${state.cardFilter === key ? 'active' : ''}" data-card-filter="${key}">${label}</button>`
            ).join('')}
          </div>
          <div class="result-muted" style="margin-bottom:12px;font-size:12px;">显示 ${cards.length} / ${allCards.length} 条证据</div>
          ${cards.map((card) => {
            const readingHint = card.gate?.decision === 'downgrade' && normalizeWarnings(card.gate.required_warnings).length
              ? normalizeWarnings(card.gate.required_warnings)[0] : '';
            const details = [
              { k: '来源记录', v: card.source_id || '—' },
              { k: '匹配变异', v: card.matched_variant || card.variant_id || '—' },
              { k: '获取状态', v: zh(card.access_status) },
              { k: '记录状态', v: zh(card.record_status) },
              { k: '审核状态', v: zh(card.review_status) },
              { k: '证据类型', v: zh(card.evidence_type) },
              { k: '证据方向', v: zh(card.direction) },
              { k: '相关药物', v: zh(card.drug) },
              { k: '更新时间', v: card.publication_or_release_date || '—' },
              { k: 'ClinVar 星级', v: card.star_rating || '—' },
              { k: '人群 / 入组', v: card.population || '—', wide: true },
              { k: '干预与结局', v: card.intervention_and_outcome || '—', wide: true },
              { k: '适用性', v: card.applicability || '—', wide: true },
              { k: '局限性', v: card.limitations || '—', wide: true },
            ];
            const frameworkBits = [
              card.amp_tier ? `AMP ${card.amp_tier}` : '',
              card.escat_level ? `ESCAT ${card.escat_level}` : '',
              card.acmg_class ? `ACMG ${card.acmg_class}` : '',
            ].filter(Boolean);
            return `
            <article class="evidence-card">
              <div class="evidence-head">
                <div style="min-width:0;flex:1;">
                  <div class="evidence-title">${escapeHtml(card.source_title || card.source_id || 'Evidence')}</div>
                  <div class="evidence-meta">
                    <span class="provider-badge ${escapeHtml(String(card.provider || 'mock').toLowerCase())}">${escapeHtml(providerLabel(card.provider))}</span>
                    <span>内部等级：${escapeHtml(card.evidence_level || '-')}</span>
                    ${frameworkBits.map((x) => `<span>${escapeHtml(x)}</span>`).join('')}
                    <span>疾病匹配：${escapeHtml(card.disease_match || '-')}</span>
                    ${card.gate?.decision ? `<span class="status-badge ${toneOf(card.gate.decision)}">门控：${escapeHtml(zh(card.gate.decision))}</span>` : ''}
                  </div>
                </div>
                ${card.source_url ? `<a class="btn ghost" href="${escapeHtml(card.source_url)}" target="_blank" rel="noopener noreferrer" style="padding:7px 11px;font-size:12px;">打开来源</a>` : ''}
              </div>
              ${readingHint ? `<div class="reading-hint"><strong>阅读提示：</strong>${escapeHtml(readingHint)}</div>` : ''}
              <div class="evidence-claim">${escapeHtml(card.claim || '')}</div>
              <div class="detail-grid">
                ${details.map((d) => `<div class="detail-item ${d.wide ? 'wide' : ''}"><div class="k">${escapeHtml(d.k)}</div><div class="v">${escapeHtml(d.v || '—')}</div></div>`).join('')}
              </div>
              ${card.conflict?.has_conflict ? `<div class="warning-block bad">冲突：${escapeHtml(card.conflict.description || '存在未解决冲突')}${card.conflict.resolution ? `；处理：${escapeHtml(card.conflict.resolution)}` : ''}</div>` : ''}
              ${normalizeWarnings(card.safety_flags).length ? `<div class="warning-block">安全提示：${escapeHtml(card.safety_flags.join('；'))}</div>` : ''}
              ${card.original_claim ? `<div class="sub-box" style="margin-top:10px;"><h4>数据库原始英文表述</h4><div style="font-size:12px;line-height:1.7;" lang="en">${escapeHtml(card.original_claim)}</div></div>` : ''}
            </article>`;
          }).join('')}`;
      }

      /* ---------------- 渲染：安全门控 ---------------- */
      function renderGatesSection(payload) {
        const variantsById = new Map((payload.variants || []).map((v) => [v.variant_id, v]));
        const gates = [...(payload.safety?.variant_gates || []), ...(payload.safety?.card_gates || [])].filter((gate) => {
          const reasons = normalizeWarnings(gate.reasons || []).join(' ').toLowerCase();
          return !reasons.includes('query error') && !reasons.includes('查询错误') && !reasons.includes('查询失败');
        });
        const grouped = new Map();
        gates.forEach((gate) => {
          const key = JSON.stringify({
            decision: gate.decision || '',
            strength: gate.allowed_claim_strength || '',
            reasons: [...normalizeWarnings(gate.reasons)].sort(),
            blocked: [...normalizeWarnings(gate.blocked_outputs)].sort(),
          });
          const existing = grouped.get(key);
          if (existing) {
            existing.count += 1;
            if (gate.evidence_id) existing.evidenceIds.push(gate.evidence_id);
            if (gate.variant_id) existing.variantIds.push(gate.variant_id);
          } else {
            grouped.set(key, { ...gate, count: 1, evidenceIds: gate.evidence_id ? [gate.evidence_id] : [], variantIds: gate.variant_id ? [gate.variant_id] : [] });
          }
        });
        const list = Array.from(grouped.values());
        if (!list.length) return `<div class="result-muted">暂无门控结果。</div>`;
        return list.map((gate) => {
          const target = gate.evidenceIds.length === 1
            ? `证据 ${gate.evidenceIds[0]}`
            : gate.evidenceIds.length > 1
              ? `${gate.evidenceIds.length} 条证据`
              : gate.variantIds.length === 1
                ? `${escapeHtml(variantLabel(variantsById.get(gate.variantIds[0]) || {}))}（变异）`
                : `${gate.count} 个变异`;
          const reasons = normalizeWarnings(gate.reasons);
          let note = '';
          if (reasons.length) {
            note = `<div class="gate-note">${reasons.map((r) => `<span>${escapeHtml(r)}</span>`).join('')}</div>`;
          } else if (gate.decision && gate.decision !== 'allow') {
            const warnings = normalizeWarnings(gate.required_warnings);
            if (warnings.length) note = `<div class="gate-note"><span>${escapeHtml(warnings[0])}</span></div>`;
          }
          const blocked = normalizeWarnings(gate.blocked_outputs);
          return `
            <div class="gate-card">
              <div class="gate-head">
                <div>
                  <div class="gate-target">${target}</div>
                  <div class="gate-strength">结论强度：${escapeHtml(zh(gate.allowed_claim_strength))}</div>
                </div>
                <span class="status-badge ${toneOf(gate.decision)}">${escapeHtml(zh(gate.decision))}</span>
              </div>
              ${note}
              ${blocked.length ? `<div class="gate-blocks"><span class="gate-blocks-label">阻断输出</span>${blocked.map((b) => `<span class="gate-block-tag">${escapeHtml(zh(b))}</span>`).join('')}</div>` : ''}
            </div>`;
        }).join('');
      }

      /* ---------------- 渲染：补充信息 ---------------- */
      function renderMissingSection(payload) {
        const missing = payload.missing || {};
        const blocking = missing.blocking || [];
        const advisory = missing.advisory || [];
        const warnings = payload.global_warnings || [];
        return `
          <div class="missing-grid">
            <div class="missing-card">
              <h4>需要优先补充 <span class="status-badge ${blocking.length ? 'bad' : 'ok'}">${blocking.length ? `${blocking.length} 项` : '无阻断项'}</span></h4>
              ${blocking.length ? `<ul>${blocking.map((x) => `<li>${escapeHtml(x)}</li>`).join('')}</ul>` : '<div class="result-muted" style="font-size:13px;">当前核心信息已满足基础解析。</div>'}
            </div>
            <div class="missing-card">
              <h4>建议补充以提高精度 <span class="status-badge ${advisory.length ? 'warn' : 'ok'}">${advisory.length ? `${advisory.length} 项` : '无建议项'}</span></h4>
              ${advisory.length ? `<ul>${advisory.map((x) => `<li>${escapeHtml(x)}</li>`).join('')}</ul>` : '<div class="result-muted" style="font-size:13px;">暂无。</div>'}
            </div>
            <div class="missing-card">
              <h4>全局使用边界 <span class="status-badge ${blocking.length ? 'bad' : 'neutral'}">${blocking.length ? '需谨慎' : '可继续讨论'}</span></h4>
              ${warnings.length ? `<ul>${warnings.map((x) => `<li>${escapeHtml(x)}</li>`).join('')}</ul>` : '<div class="result-muted" style="font-size:13px;">暂无。</div>'}
            </div>
          </div>`;
      }

      /* ---------------- 主渲染 ---------------- */
      const SECTIONS = [
        { id: 'sec-summary', title: '医生摘要 / 概况', sub: '先验结论与优先动作', render: renderSummarySection },
        { id: 'sec-variants', title: '变异解析与结构', sub: '映射·坐标·功能', render: renderVariantsSection, count: (p) => `${(p.variants || []).length} 个变异` },
        { id: 'sec-answer', title: '临床解释与通路', sub: '完整 markdown 问答', render: renderAnswerSection },
        { id: 'sec-evidence', title: '变异与证据数据', sub: '证据卡·等级·来源', render: renderEvidenceSection, count: (p) => `${(p.evidence || []).filter(isDisplayableCard).length} 条证据` },
        { id: 'sec-gates', title: '安全门控', sub: '受限与阻断范围', render: renderGatesSection, count: (p) => {
          const gates = [...(p.safety?.variant_gates || []), ...(p.safety?.card_gates || [])];
          const warnCount = gates.filter((g) => g.decision === 'downgrade' || g.decision === 'ask_for_confirmation' || g.decision === 'refuse').length;
          return warnCount ? `<span class="status-badge warn">${warnCount} 项需注意</span>` : `<span class="status-badge ok">${gates.length} 项门控</span>`;
        } },
        { id: 'sec-missing', title: '补充信息与边界', sub: '待补充与使用边界', render: renderMissingSection, count: (p) => {
          const missing = p.missing || {};
          const blocking = (missing.blocking || []).length;
          const advisory = (missing.advisory || []).length;
          if (blocking) return `<span class="status-badge bad">${blocking} 项待补充</span>`;
          if (advisory) return `<span class="status-badge warn">${advisory} 项建议</span>`;
          return `<span class="status-badge ok">无缺失</span>`;
        } },
      ];

      function geneSectionHtml(sec, payload) {
        const countHtml = sec.count ? sec.count(payload) : '';
        return `
          <section class="gene-section" id="${sec.id}" data-nav-target="${sec.id}">
            <div class="gene-section-head">
              <div>
                <span class="gene-section-title">${escapeHtml(sec.title)}</span>
                <span class="gene-section-sub">${escapeHtml(sec.sub)}</span>
              </div>
              ${countHtml ? `<span class="gene-section-count">${countHtml}</span>` : ''}
            </div>
            <div class="gene-section-body">${sec.render(payload)}</div>
          </section>`;
      }

      function renderResult(payload) {
        state.lastPayload = payload;
        els.summaryGrid.hidden = false;
        els.summaryEvidenceBadge.hidden = !payload?.summary;
        
        // 渲染数据源状态
        renderProviderStatus(payload);
        
        els.resultStack.innerHTML = SECTIONS.map((sec) => geneSectionHtml(sec, payload)).join('');
        bindCardFilters();
        bindScrollspy();
      }

      function bindCardFilters() {
        els.resultStack.querySelectorAll('[data-card-filter]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.cardFilter = btn.dataset.cardFilter || 'all';
            renderResult(state.lastPayload || emptyPayload());
          });
        });
      }

      /* ---------------- 滚动定位 ---------------- */
      function bindScrollspy() {
        const links = new Map();
        els.resultSidebar.querySelectorAll('[data-result-nav]').forEach((a) => {
          const href = a.getAttribute('href');
          if (href) links.set(href.slice(1), a);
        });
        if (!('IntersectionObserver' in window)) {
          links.forEach((a, id) => a.addEventListener('click', () => setActiveLink(id)));
          return;
        }
        const setActiveLink = (id) => {
          links.forEach((a, key) => a.classList.toggle('active', key === id));
        };
        const observer = new IntersectionObserver(
          (entries) => {
            const visible = entries.filter((e) => e.isIntersecting);
            if (!visible.length) return;
            visible.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
            setActiveLink(visible[0].target.id);
          },
          { rootMargin: '-30% 0px -60% 0px', threshold: 0 }
        );
        SECTIONS.forEach((sec) => {
          const el = document.getElementById(sec.id);
          if (el) observer.observe(el);
        });
      }
      els.resultSidebar.addEventListener('click', (e) => {
        const link = e.target.closest('[data-result-nav]');
        if (!link) return;
        const id = (link.getAttribute('href') || '').slice(1);
        const target = document.getElementById(id);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });

      /* ---------------- 历史 ---------------- */
      function emptyPayload() {
        return {
          meta: { provider_mode: '-', retrieved_at: '-', cache_hit: false },
          query: {},
          variants: [],
          evidence: [],
          safety: { variant_gates: [], card_gates: [] },
          answer: { markdown: '请先发起一次查询。' },
          summary: {},
          missing: { blocking: [], advisory: [] },
          global_warnings: [],
          audit: { provider_status: {}, agent_trace: [], resolver_status: {} },
        };
      }
      function renderHistory() {
        const list = state.history || [];
        els.historyCountBadge.textContent = `历史 ${list.length} 条`;
        els.historyPanel.hidden = !state.historyVisible;
        if (!list.length) {
          els.historyPanel.innerHTML = '<div class="history-item"><div class="result-muted">暂无历史记录，查询后会自动保存到本地。</div></div>';
          return;
        }
        els.historyPanel.innerHTML = list.map((item, idx) => `
          <article class="history-item ${idx === 0 ? 'active' : ''}" data-history-index="${idx}">
            <div class="history-item-head">
              <div style="min-width:0;">
                <div class="history-item-title">${escapeHtml(item.label || '未命名查询')}</div>
                <div class="history-item-meta">时间：${escapeHtml(formatRetrievedAt(item.retrieved_at))} · 证据卡：${escapeHtml(String(item.evidenceCount ?? 0))} · 变异：${escapeHtml(String(item.variantCount ?? 0))}</div>
              </div>
              <span class="status-badge ${toneOf(item.gateState)}">${escapeHtml(item.gateState || '未知')}</span>
            </div>
            <div class="history-item-meta">${escapeHtml(item.variantsText || '')}</div>
          </article>`).join('');
      }
      function addHistoryEntry(payload, variantsText) {
        const gates = [...(payload.safety?.variant_gates || []), ...(payload.safety?.card_gates || [])];
        const warnCount = gates.filter((g) => g.decision === 'downgrade' || g.decision === 'ask_for_confirmation' || g.decision === 'refuse').length;
        const gateState = warnCount ? '保守 / 需注意' : (gates.some((g) => g.decision === 'allow') ? '允许' : '未知');
        const entry = {
          label: String(variantsText || '分子证据查询').slice(0, 60),
          variantsText: String(variantsText || '').slice(0, 200),
          retrieved_at: payload.meta?.retrieved_at || new Date().toISOString(),
          variantCount: (payload.variants || []).length,
          evidenceCount: (payload.evidence || []).length,
          gateState,
          payload,
        };
        state.history = [entry, ...state.history.filter((item) => item.retrieved_at !== entry.retrieved_at)].slice(0, HISTORY_LIMIT);
        try { localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history)); } catch { /* ignore */ }
        renderHistory();
      }
      function loadHistory() {
        try {
          const raw = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
          state.history = Array.isArray(raw) ? raw : [];
        } catch {
          state.history = [];
        }
        renderHistory();
      }

      /* ---------------- 复制 ---------------- */
      async function copyText(text, btn, label) {
        try {
          await navigator.clipboard.writeText(text);
          btn.textContent = '已复制';
          setTimeout(() => { btn.textContent = label; }, 1200);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
          btn.textContent = '已复制';
          setTimeout(() => { btn.textContent = label; }, 1200);
        }
      }
      // 复制摘要 / 复制结果：在回答下方展示，与问答助手的操作栏一致。
      els.resultStack.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-copy-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-copy-action');
        if (action === 'answer') {
          if (state.lastPayload?.answer?.markdown) copyText(state.lastPayload.answer.markdown, btn, '复制结果');
        } else if (action === 'summary') {
          const summary = state.lastPayload?.summary;
          if (!summary) return;
          const lines = [
            `医生摘要：${summary.conclusion || '—'}`,
            `优先动作：${summary.priority_action || '—'}`,
            `下一步：${summary.recommended_next_step || summary.next_step || '—'}`,
            `变异数：${summary.variant_count ?? 0}；证据卡：${summary.card_count ?? 0}`,
            `直接证据：${summary.direct_evidence_count ?? 0}；近似证据：${summary.near_evidence_count ?? 0}；外推证据：${summary.proxy_evidence_count ?? 0}`,
          ];
          copyText(lines.join('\n'), btn, '复制摘要');
        }
      });

      /* ---------------- 历史按钮 ---------------- */      
      els.historyToggleBtn.addEventListener('click', () => {
        state.historyVisible = !state.historyVisible;
        renderHistory();
      });
      els.clearHistoryBtn.addEventListener('click', () => {
        if (!confirm('确认清空所有本地查询历史？')) return;
        state.history = [];
        localStorage.removeItem(HISTORY_KEY);
        renderHistory();
      });
      els.historyPanel.addEventListener('click', (e) => {
        const card = e.target.closest('.history-item');
        if (!card) return;
        const idx = Number(card.dataset.historyIndex);
        if (!Number.isFinite(idx)) return;
        const item = state.history[idx];
        if (!item?.payload) return;
        els.historyPanel.querySelectorAll('.history-item').forEach((el) => el.classList.remove('active'));
        card.classList.add('active');
        renderResult(item.payload);
      });

      /* ---------------- 参数面板 / 弹层 ---------------- */
      function currentParamSummary() {
        const disease = els.disease.value || 'DLBCL';
        const sample = els.sampleType.value || 'tumor tissue';
        const mode = els.providerMode.value || 'mock';
        return `疾病 ${disease} · 样本 ${sample} · 模式 ${mode}`;
      }
      function syncParamChip() {
        if (els.paramChipLabel) els.paramChipLabel.textContent = currentParamSummary();
      }
      function setSettingsOpen(open) {
        els.settingsPanel.hidden = !open;
        els.paramChip.setAttribute('aria-expanded', String(open));
        els.paramChip.classList.toggle('is-open', open);
      }
      els.paramChip.addEventListener('click', (e) => {
        e.stopPropagation();
        setSettingsOpen(els.settingsPanel.hidden);
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.param-chip-wrap') && !els.settingsPanel.hidden) {
          setSettingsOpen(false);
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !els.settingsPanel.hidden) setSettingsOpen(false);
      });
      ['disease', 'sampleType', 'genomeBuild', 'transcript', 'variantType', 'providerMode'].forEach((id) => {
        els[id]?.addEventListener('change', syncParamChip);
        els[id]?.addEventListener('input', syncParamChip);
      });
      syncParamChip();

      /* ---------------- OCR ---------------- */
      async function uploadReportForOcr(file) {
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);
        els.composerStatus.textContent = `正在 OCR 识别 ${file.name}…`;
        els.composerStatus.classList.remove('composer-error');
        try {
          const resp = await fetch(`${API_BASE}/api/molecular-evidence/ocr`, {
            method: 'POST',
            credentials: 'include',
            body: formData,
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok) throw new Error(data.detail || 'OCR 失败');
          if (data.text) {
            els.composerText.value = data.text;
            els.composerText.style.height = 'auto';
            els.composerText.style.height = Math.min(320, Math.max(44, els.composerText.scrollHeight)) + 'px';
            els.composerStatus.textContent = `${data.message || 'OCR 已完成'} 请核对文字后发送。`;
          } else {
            els.composerStatus.textContent = data.message || 'OCR 未获得文字，请改用文字粘贴。';
          }
        } catch (err) {
          els.composerStatus.textContent = `OCR 失败：${String(err?.message || err)}`;
          els.composerStatus.classList.add('composer-error');
        } finally {
          els.reportImageInput.value = '';
        }
      }
      els.composerAddBtn.addEventListener('click', () => els.reportImageInput.click());
      els.reportImageInput.addEventListener('change', (e) => uploadReportForOcr(e.target.files?.[0]));

      /* ---------------- 查询 ---------------- */
      function currentVariantsText() {
        return String(els.composerText.value || '').trim();
      }
      function setLoading(isLoading) {
        els.composerSendBtn.disabled = isLoading;
        els.composerSendBtn.textContent = isLoading ? '…' : '↑';
        if (isLoading) {
          els.composerStatus.textContent = '正在标准化变异、检索证据并生成分析结果…';
          els.composerStatus.classList.remove('composer-error');
        } else if (state.lastPayload) {
          els.composerStatus.textContent = '分析完成，可继续输入新的分子信息。';
        }
      }
      async function submitQuery() {
        const variantsText = currentVariantsText();
        if (!variantsText) {
          setError('请输入分子信息，例如 MYD88 p.L265P, CD79B p.Y196H。');
          els.composerText.focus();
          return;
        }
        setLoading(true);
        try {
          const resp = await api('/api/molecular-evidence/query', {
            method: 'POST',
            body: JSON.stringify({
              variants_text: variantsText,
              disease: els.disease.value || 'DLBCL',
              sample_type: els.sampleType.value || 'tumor tissue',
              genome_build: (els.genomeBuild.value || '').trim() || null,
              transcript: (els.transcript.value || '').trim() || null,
              variant_type: (els.variantType.value || '').trim() || null,
              question: null,
              provider_mode: els.providerMode.value || 'mock',
            }),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok) {
            const detail = Array.isArray(data.detail)
              ? data.detail.map((d) => d.msg || JSON.stringify(d)).join('；')
              : (data.detail || data.message || '查询失败');
            setError(detail);
            return;
          }
          document.body.classList.remove('pre-query');
          state.cardFilter = 'all';
          state.summaryVisible = true;
          renderResult(data);
          els.composerText.value = '';
          els.composerText.style.height = 'auto';
          addHistoryEntry(data, variantsText);
        } catch (err) {
          setError(`网络错误：${String(err?.message || err)}`);
        } finally {
          setLoading(false);
        }
      }
      els.composerSendBtn.addEventListener('click', submitQuery);
      els.composerText.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          submitQuery();
        }
      });
      els.composerText.addEventListener('input', () => {
        els.composerText.style.height = 'auto';
        els.composerText.style.height = Math.min(160, Math.max(44, els.composerText.scrollHeight)) + 'px';
      });

      /* ---------------- 初始化 ---------------- */
      loadHistory();
      els.heroStateBadge.textContent = '等待查询';
      els.heroTime.textContent = '检索时间 -';
      els.heroMode.textContent = '模式 -';
      
      // 隐藏数据源状态面板
      els.providerStatusGrid.hidden = true;
    })();
  </script>
</body>
</html>
